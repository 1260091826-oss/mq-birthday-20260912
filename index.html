<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 MQ 27岁生日邀请</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #fdf6ec, #f5e1c0); padding: 20px; }
        .container { text-align: center; max-width: 550px; width: 100%; }
        h1 { font-size: 1.8rem; color: #4a3728; margin-bottom: 25px; text-shadow: 2px 2px 0 rgba(255, 215, 150, 0.5); }
        .card { background: rgba(255, 248, 240, 0.95); backdrop-filter: blur(10px); border-radius: 30px; padding: 35px 28px; box-shadow: 0 20px 60px rgba(74, 55, 40, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.6); border: 2px solid rgba(255, 215, 150, 0.3); }
        .avatar { font-size: 4rem; margin-bottom: 10px; display: block; }
        h2 { font-size: 1.8rem; color: #4a3728; margin-bottom: 6px; }
        .age { font-size: 1.1rem; color: #8b6b4a; margin-bottom: 18px; }
        .age strong { color: #d4845a; font-size: 1.3rem; }
        .info-grid { background: #f5ede5; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; }
        .info-item { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 0; font-size: 0.98rem; color: #4a3728; }
        .info-item .icon { font-size: 1.2rem; }
        .tasks { background: #faf3ea; border-radius: 16px; padding: 14px 18px; margin-bottom: 14px; text-align: left; }
        .tasks-title { font-weight: 600; color: #4a3728; margin-bottom: 6px; text-align: center; }
        .tasks ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; padding: 0; }
        .tasks ul li { color: #5a4a3a; font-size: 0.95rem; }
        .menu { background: #faf3ea; border-radius: 16px; padding: 14px 18px; margin-bottom: 18px; }
        .menu-title { font-weight: 600; color: #4a3728; margin-bottom: 6px; }
        .menu-items { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 20px; }
        .menu-items span { color: #5a4a3a; font-size: 0.95rem; background: #fff; padding: 4px 14px; border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .message { font-size: 1.08rem; color: #5a4a3a; line-height: 1.8; min-height: 50px; padding: 12px 0; border-top: 2px dashed #e8d5c4; border-bottom: 2px dashed #e8d5c4; margin-bottom: 18px; }
        .button-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .button-group button { padding: 12px 24px; font-size: 0.95rem; font-weight: 600; color: #4a3728; background: linear-gradient(135deg, #fddb92, #f5b87e); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 16px rgba(245, 184, 126, 0.35); transition: all 0.25s ease; flex: 1 1 auto; min-width: 100px; }
        .button-group button:first-child { background: linear-gradient(135deg, #a8d8ea, #7ec8e3); box-shadow: 0 4px 16px rgba(126, 200, 227, 0.4); }
        .button-group button:last-child { background: linear-gradient(135deg, #f5b7a1, #e8987a); box-shadow: 0 4px 16px rgba(232, 152, 122, 0.4); }
        @media (max-width: 480px) { h1 { font-size: 1.4rem; } .card { padding: 22px 16px; } h2 { font-size: 1.5rem; } .avatar { font-size: 3.2rem; } .button-group button { font-size: 0.85rem; padding: 10px 16px; min-width: 80px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 星露谷生日邀请函</h1>
        <div class="card">
            <span class="avatar">🎈</span>
            <h2>🎂 亲爱的 MQ</h2>
            <p class="age">✨ 欢迎来到 <strong>27 岁</strong> 的生日派对！</p>
            <div class="info-grid">
                <div class="info-item"><span class="icon">📅</span><span>2026年9月12日 星期六</span></div>
                <div class="info-item"><span class="icon">⏰</span><span>19:00</span></div>
                <div class="info-item"><span class="icon">📍</span><span>长沙市岳麓区蕊果 RiNGÓ</span></div>
            </div>
            <div class="tasks">
                <p class="tasks-title">🎯 你的任务（4项）</p>
                <ul>
                    <li>✅ 带上好心情</li>
                    <li>✅ 准时到场</li>
                    <li>✅ 准备一个小故事</li>
                    <li>✅ 拥抱寿星</li>
                </ul>
            </div>
            <div class="menu">
                <p class="menu-title">🍽️ 当晚菜单</p>
                <div class="menu-items">
                    <span>🎂 生日蛋糕（定制款）</span>
                    <span>🍺 啤酒</span>
                    <span>🍟 炸薯条</span>
                </div>
            </div>
            <p class="message">✨ 愿你的27岁，像星露谷的秋天一样，硕果累累，温暖灿烂！</p>
            <div class="button-group">
                <button onclick="alert('🎵 请把你的背景音乐放到同目录下')">🎵 播放音乐</button>
                <button onclick="location.reload()">✨ 随机祝福</button>
                <button onclick="window.open('https://uri.amap.com/search?keyword=蕊果%20RiNG%C3%93','_blank')">🗺️ 导航前往</button>
            </div>
        </div>
    </div>
</body>
</html>
