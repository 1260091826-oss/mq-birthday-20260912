<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 MQ 27岁生日邀请</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>🎉 星露谷生日邀请函</h1>
        <div class="card" id="birthdayCard">
            <span class="avatar" id="avatar">🎈</span>
            <h2 id="name">🎂 亲爱的 MQ</h2>
            <p class="age">✨ 欢迎来到 <strong>27 岁</strong> 的生日派对！</p>
            <div class="info-grid">
                <div class="info-item"><span class="icon">📅</span><span>2026年9月12日 星期六</span></div>
                <div class="info-item"><span class="icon">⏰</span><span>19:00</span></div>
                <div class="info-item"><span class="icon">📍</span><span>长沙市岳麓区蕊果 RiNGÓ</span></div>
            </div>
            <div class="tasks">
                <p class="tasks-title">🎯 你的任务（4项）</p>
                <ul>
                    <li>✅ 带上好心情</li>
                    <li>✅ 准时到场</li>
                    <li>✅ 准备一个小故事</li>
                    <li>✅ 拥抱寿星</li>
                </ul>
            </div>
            <div class="menu">
                <p class="menu-title">🍽️ 当晚菜单</p>
                <div class="menu-items">
                    <span>🎂 生日蛋糕（定制款）</span>
                    <span>🍺 啤酒</span>
                    <span>🍟 炸薯条</span>
                </div>
            </div>
            <p class="message" id="message">愿你的27岁，像星露谷的秋天一样，硕果累累，温暖灿烂！</p>
            <div class="button-group">
                <button onclick="toggleMusic()">🎵 播放音乐</button>
                <button onclick="generateNew()">✨ 随机祝福</button>
                <button onclick="openMap()">🗺️ 导航前往</button>
            </div>
        </div>
    </div>
    <audio id="bgm" loop><source src="assets/birthday-bgm.mp3" type="audio/mpeg"></audio>
    <script src="script.js"></script>
</body>
</html>
